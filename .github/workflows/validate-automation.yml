name: Validate automation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-automation.yml'

permissions:
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate current Zenodo DOI lookup
        run: |
          DOI="$(python3 .github/scripts/sync_zenodo_doi.py --version 1.0.0)"
          test "$DOI" = "10.5281/zenodo.21921806"
          echo "Zenodo lookup OK: $DOI"

      - name: Dispatch test desktop builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          gh workflow run build-desktop.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref=main

          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/build-desktop.yml/runs?event=workflow_dispatch&head_sha=${SHA}&per_page=10" \
                --jq '.workflow_runs[0].id // empty'
            )"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 4
          done

          if [ -z "$RUN_ID" ]; then
            echo 'Could not locate test desktop build run.'
            exit 1
          fi

          echo "Desktop test run: $RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
