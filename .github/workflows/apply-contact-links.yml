name: Apply contact and project links

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-contact-links.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Update manual and application links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              path.write_text(text.replace(old, new, 1))

          manual = Path('MANUAL.md')
          replace_once(
              manual,
              '**Current manual version: 1.0.2**\n',
              '**Current manual version: 1.0.2**\n\n'
              '**Author:** Sebastiano Romi  \n'
              '**Affiliation:** European Laboratory for non-Linear Spectroscopy (LENS), Università degli Studi di Firenze (UNIFI)  \n'
              '**Contact:** [romi@lens.unifi.it](mailto:romi@lens.unifi.it)\n',
          )

          app = Path('opus2txt.py')
          replace_once(
              app,
              'APP_NAME = "OPUS2TXT"\nORGANIZATION_NAME = "opus2txt"\n',
              'APP_NAME = "OPUS2TXT"\n'
              'ORGANIZATION_NAME = "opus2txt"\n'
              'MANUAL_URL = "https://github.com/SebRoLENS/opus2txt/blob/main/MANUAL.md"\n'
              'GITHUB_URL = "https://github.com/SebRoLENS/opus2txt"\n',
          )
          replace_once(
              app,
              '        outputs.setObjectName("outputs")\n        layout.addWidget(outputs)\n\n',
              '        outputs.setObjectName("outputs")\n'
              '        layout.addWidget(outputs)\n\n'
              '        links = QLabel(\n'
              '            f\'<a href="{MANUAL_URL}">User manual</a>\'\n'
              '            \' &nbsp;·&nbsp; \'\n'
              '            f\'<a href="{GITHUB_URL}">Check GitHub for updates and new releases</a>\'\n'
              '        )\n'
              '        links.setObjectName("links")\n'
              '        links.setTextFormat(Qt.TextFormat.RichText)\n'
              '        links.setTextInteractionFlags(Qt.TextInteractionFlag.TextBrowserInteraction)\n'
              '        links.setOpenExternalLinks(True)\n'
              '        layout.addWidget(links)\n\n',
          )
          replace_once(
              app,
              '            QLabel#outputs, QLabel#status {\n                color: palette(text);\n                font-size: 12px;\n            }\n',
              '            QLabel#outputs, QLabel#status, QLabel#links {\n'
              '                color: palette(text);\n'
              '                font-size: 12px;\n'
              '            }\n',
          )
          replace_once(
              app,
              '\ndef main() -> int:\n    app = QApplication(sys.argv)\n',
              '\ndef print_terminal_resources() -> None:\n'
              '    """Show documentation and update links when launched from a terminal."""\n'
              '    if getattr(sys, "stdout", None) is None:\n'
              '        return\n'
              '    print(f"{APP_NAME} {__version__}")\n'
              '    print(f"Manual: {MANUAL_URL}")\n'
              '    print(f"Check GitHub for updates and new releases: {GITHUB_URL}")\n'
              '    print()\n\n\n'
              'def main() -> int:\n'
              '    print_terminal_resources()\n'
              '    app = QApplication(sys.argv)\n',
          )
          PY

          python3 -m py_compile opus2txt.py

      - name: Commit coordinated update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opus2txt.py MANUAL.md
          git commit -m 'Add author contact and documentation/update links'
          git push origin HEAD:main
