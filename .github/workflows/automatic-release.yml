name: Automatic release

on:
  push:
    branches:
      - main
    paths:
      - 'opus2txt.py'
      - 'packaging/**'
      - '.release-trigger'

permissions:
  contents: write
  actions: write

concurrency:
  group: automatic-release-offscreen
  cancel-in-progress: true

jobs:
  prepare-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended libegl1 libgl1 libopengl0
          python -m pip install --upgrade pip
          python -m pip install PySide6 brukeropus

      - name: Prepare next version
        id: prepare
        run: |
          VERSION="$(python3 .github/scripts/prepare_release.py)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing opus2txt v$VERSION"

      - name: Capture GUI screenshot
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p docs
          python - <<'PY'
          from pathlib import Path
          from PySide6.QtCore import Qt
          from PySide6.QtGui import QPixmap
          from PySide6.QtWidgets import QApplication
          from opus2txt import MainWindow

          app = QApplication([])
          window = MainWindow()
          window.ensurePolished()
          window.show()
          app.processEvents()

          pixmap = QPixmap(window.size())
          pixmap.fill(Qt.GlobalColor.transparent)
          window.render(pixmap)

          target = Path('docs/opus2txt_gui.png')
          if pixmap.isNull() or not pixmap.save(str(target), 'PNG'):
              raise SystemExit('Could not save GUI screenshot')
          window.close()
          app.quit()
          print(f'Saved {target} ({pixmap.width()}x{pixmap.height()})')
          PY
          test -s docs/opus2txt_gui.png
          rm -f docs/screenshot_error.txt

      - name: Build versioned PDF manual
        run: |
          pandoc MANUAL.md \
            --from markdown \
            --resource-path=. \
            --pdf-engine=xelatex \
            --output MANUAL.pdf

      - name: Commit release metadata
        id: commit
        run: |
          VERSION="${{ steps.prepare.outputs.version }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opus2txt.py README.md CITATION.cff MANUAL.md MANUAL.pdf docs/opus2txt_gui.png
          if [ -e docs/screenshot_error.txt ]; then git rm -f docs/screenshot_error.txt; fi
          git commit -m "Prepare v${VERSION} release"
          git push origin HEAD:main
          SHA="$(git rev-parse HEAD)"
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
            exit 1
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          ## opus2txt v${VERSION}

          Automated release generated after an update to opus2txt.

          Desktop applications are built automatically for Linux x86_64, Windows x86_64,
          macOS Apple Silicon, and macOS Intel.

          **Zenodo DOI:** pending automatic archival.
          EOF
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --title "opus2txt v${VERSION}" --notes-file /tmp/release-notes.md --verify-tag

      - name: Dispatch desktop builds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          gh workflow run build-desktop.yml --repo "$GITHUB_REPOSITORY" --ref main -f "source_ref=v${VERSION}"
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-desktop.yml/runs?event=workflow_dispatch&head_sha=${RELEASE_SHA}&per_page=10" --jq '.workflow_runs[0].id // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 4
          done
          if [ -z "$RUN_ID" ]; then echo "Could not locate desktop build run"; exit 1; fi
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

  sync-zenodo-doi:
    needs: prepare-release
    if: ${{ needs.prepare-release.result == 'success' && needs.prepare-release.outputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Wait for Zenodo GitHub integration
        id: zenodo
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          DOI=""
          for attempt in $(seq 1 60); do
            set +e
            DOI="$(python3 .github/scripts/sync_zenodo_doi.py --version "$VERSION")"
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ] && [ -n "$DOI" ]; then break; fi
            sleep 60
          done
          if [ -z "$DOI" ]; then echo "Zenodo DOI was not found within one hour."; exit 1; fi
          python3 .github/scripts/sync_zenodo_doi.py --version "$VERSION" --apply >/dev/null
          echo "doi=$DOI" >> "$GITHUB_OUTPUT"
      - name: Commit DOI and citation metadata
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          DOI: ${{ steps.zenodo.outputs.doi }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CITATION.cff
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Link v${VERSION} to Zenodo DOI ${DOI}"
          git push origin HEAD:main
      - name: Add DOI to GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          DOI: ${{ steps.zenodo.outputs.doi }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          ## opus2txt v${VERSION}

          Automated release generated after an update to opus2txt.

          Desktop applications are available for Linux x86_64, Windows x86_64,
          macOS Apple Silicon, and macOS Intel.

          **Zenodo DOI:** https://doi.org/${DOI}
          EOF
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md
