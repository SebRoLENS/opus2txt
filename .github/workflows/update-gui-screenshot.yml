name: Update GUI screenshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'opus2txt.py'
      - '.github/workflows/update-gui-screenshot.yml'

permissions:
  contents: write

jobs:
  screenshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 brukeropus

      - name: Render current GUI or record diagnostic
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p docs
          python - <<'PY'
          from pathlib import Path
          import traceback

          error_file = Path('docs/screenshot_error.txt')
          target = Path('docs/opus2txt_gui.png')

          try:
              from PySide6.QtCore import Qt
              from PySide6.QtGui import QPainter, QPixmap
              from PySide6.QtWidgets import QApplication
              from opus2txt import MainWindow

              app = QApplication([])
              window = MainWindow()
              window.ensurePolished()
              window.show()
              app.processEvents()

              pixmap = QPixmap(window.size())
              pixmap.fill(Qt.GlobalColor.transparent)
              painter = QPainter(pixmap)
              window.render(painter)
              painter.end()

              if pixmap.isNull() or not pixmap.save(str(target), 'PNG'):
                  raise RuntimeError('Could not save GUI screenshot')

              if error_file.exists():
                  error_file.unlink()
              print(f'Saved {target} ({pixmap.width()}x{pixmap.height()})')
              window.close()
              app.quit()
          except BaseException:
              error_file.write_text(traceback.format_exc(), encoding='utf-8')
              print(error_file.read_text(encoding='utf-8'))
          PY

      - name: Commit screenshot or diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs
          if git diff --cached --quiet; then
            echo 'No screenshot or diagnostic changes.'
            exit 0
          fi
          if [ -f docs/opus2txt_gui.png ]; then
            git commit -m 'Update GUI screenshot'
          else
            git commit -m 'Record GUI screenshot diagnostic'
          fi
          git push origin HEAD:main
