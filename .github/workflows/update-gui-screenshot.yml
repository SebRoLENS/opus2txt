name: Update GUI screenshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'opus2txt.py'
      - '.github/workflows/update-gui-screenshot.yml'

permissions:
  contents: write

jobs:
  screenshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 brukeropus

      - name: Capture current GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p docs
          python - <<'PY'
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          from opus2txt import MainWindow

          app = QApplication([])
          window = MainWindow()
          window.show()
          app.processEvents()
          pixmap = window.grab()
          target = Path('docs/opus2txt_gui.png')
          if pixmap.isNull() or not pixmap.save(str(target)):
              raise SystemExit('Could not save GUI screenshot')
          window.close()
          app.quit()
          print(f'Saved {target}')
          PY

      - name: Commit screenshot if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/opus2txt_gui.png
          if git diff --cached --quiet; then
            echo 'GUI screenshot is already up to date.'
            exit 0
          fi
          git commit -m 'Update GUI screenshot'
          git push origin HEAD:main
