name: Update GUI screenshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'opus2txt.py'
      - '.github/workflows/update-gui-screenshot.yml'

permissions:
  contents: write

jobs:
  screenshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install --upgrade pip
          python -m pip install PySide6 brukeropus

      - name: Capture current GUI
        run: |
          mkdir -p docs
          xvfb-run -a python - <<'PY'
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          from opus2txt import MainWindow

          app = QApplication([])
          window = MainWindow()
          window.show()
          app.processEvents()
          screen = window.screen()
          pixmap = screen.grabWindow(window.winId())
          if not pixmap.save(str(Path('docs/opus2txt_gui.png'))):
              raise SystemExit('Could not save GUI screenshot')
          window.close()
          app.quit()
          PY

      - name: Commit screenshot if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/opus2txt_gui.png
          if git diff --cached --quiet; then
            echo 'GUI screenshot is already up to date.'
            exit 0
          fi
          git commit -m 'Update GUI screenshot'
          git push origin HEAD:main
