name: Apply robust links and contact

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-link-contact-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded automatic release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/31793177555/cancel" || true

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Apply changes
        run: python3 .github/scripts/apply_link_contact_fix.py

      - name: Validate Python
        run: python3 -m py_compile opus2txt.py

      - name: Commit fix
        run: |
          git config user.name 'Sebastiano Romi'
          git config user.email 'romi@lens.unifi.it'
          git rm .github/workflows/apply-link-contact-fix.yml
          git rm .github/scripts/apply_link_contact_fix.py
          git add opus2txt.py
          git commit -m 'Fix project links and add contact information'
          git push origin HEAD:main
